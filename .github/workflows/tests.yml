name: Recorded-data tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        dash: ['3.4.0', '2.18.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned viewer environment
        run: python -m pip install -r requirements.txt
      - name: Install the historical Dash compatibility version
        if: matrix.dash != '3.4.0'
        run: python -m pip install "dash==${{ matrix.dash }}"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Validate recorded data and callbacks without training
        run: python -m unittest discover -s tests -v
